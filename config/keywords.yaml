# Self-brand exclusion rules (Social Listening monitors third-party mentions only)
excluded_authors:
  - "tx race"
  - "txrace"
  - "tx-race"
  - "@txrace"
  - "@txracecom"
  - "txracecom"
  - "tx race official"
  - "tx race official (@txracecom)"
  - "tx race store"
  - "tx race technical guide"
  - "baudea global"

excluded_domains:
  - "txrace.com"
  - "www.txrace.com"


