version: "1.0"
authorities:
  - kind: "data_model"
    source: "src/models/mention.py"
    description: "Authoritative schema for MentionDTO (structured social and competitor brand mention)"
  - kind: "connector_lifecycle"
    source: "src/connectors/base.py"
    description: "Authoritative lifecycle and status contract for brand intelligence connectors"
  - kind: "connector_registry"
    source: "src/connectors/registry.py"
    description: "Authoritative dynamic loader and executor for registered connectors"
  - kind: "semantic_engine"
    source: "src/engine/matcher.py"
    description: "Authoritative keyword, brand, model, generation, and negative filtering logic"
  - kind: "priority_and_response"
    source: "src/engine/prioritizer.py"
    description: "Authoritative scoring weights and copy-paste recommended response generator"
  - kind: "persistence_deduplication"
    source: "src/engine/deduplicator.py"
    description: "Authoritative SQLite-backed SHA-256 deduplication store"
  - kind: "network_resilience"
    source: "src/engine/ddos_guard.py"
    description: "Authoritative rate limiter and exponential backoff controller"
  - kind: "youtube_connector"
    source: "src/connectors/youtube.py"
    description: "Authoritative connector for YouTube Data API v3 and Shorts"
  - kind: "tiktok_connector"
    source: "src/connectors/tiktok.py"
    description: "Authoritative connector for TikTok video transformation monitoring"
  - kind: "instagram_connector"
    source: "src/connectors/instagram.py"
    description: "Authoritative connector for Instagram hashtag and mention tracking"
  - kind: "facebook_connector"
    source: "src/connectors/facebook.py"
    description: "Authoritative connector for Facebook motocross public groups and marketplace"
  - kind: "reddit_connector"
    source: "src/connectors/reddit.py"
    description: "Authoritative connector for Reddit motocross communities"
  - kind: "forums_connector"
    source: "src/connectors/forums.py"
    description: "Authoritative connector for ThumperTalk, VitalMX, and DirtRider forums"
  - kind: "marketplaces_connector"
    source: "src/connectors/marketplaces.py"
    description: "Authoritative connector for eBay Motors, Wallapop, and Craigslist"
  - kind: "twitter_connector"
    source: "src/connectors/twitter.py"
    description: "Authoritative connector for X / Twitter posts and Nitter RSS"
  - kind: "rss_web_connector"
    source: "src/connectors/rss_web.py"
    description: "Authoritative connector for Google Alerts RSS and Bing News"
  - kind: "json_exporter"
    source: "src/dispatchers/json_exporter.py"
    description: "Authoritative data dispatcher for Web SPA JSON files"
  - kind: "dashboard_spa"
    source: "dashboard/index.html"
    description: "Authoritative Web SPA interface for GitHub Pages radar"
